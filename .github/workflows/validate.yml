name: Validate

# Also builds/publishes a PR preview once validate passes (see the preview
# and deploy jobs below), and tears one down when the PR closes. This has
# to live in the same workflow file as validate, not a separate one keyed
# off validate's completion via workflow_run — that trigger only fires for
# a workflow file that already exists on the default branch, so it could
# never fire from within the very PR that introduces it. A plain job
# dependency (needs: validate) has no such restriction.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      # Code linted/typechecked by ESLint + tsc
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      # Other files Prettier formats (prettier --check .)
      - "**/*.json"
      - "**/*.css"
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.html"
      # Tooling / dependency config that changes the outcome
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".prettierrc.json"
      - ".prettierignore"
      - "eslint.config.mjs"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test coverage
        run: npm run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high

  # Publishes this PR under its own "/routines/pr-<n>/" subpath on the same
  # GitHub Pages site main deploys to (see deploy.yml), so a change can be
  # checked on a phone before merging instead of only after — but only once
  # validate has actually passed; there's no point publishing a build that
  # fails CI. On close, tears the subdirectory down instead, unconditionally
  # (validate doesn't even run for a close event, so `needs.validate` would
  # otherwise skip this too — the `always()` below is what lets it proceed).
  preview:
    needs: validate
    if: always() && github.event_name == 'pull_request' && (github.event.action == 'closed' || needs.validate.result == 'success')
    runs-on: ubuntu-latest
    # Shared across every PR, not per-ref like the workflow-level group
    # above — every preview push writes to the same pages-content branch
    # (see deploy.yml), so two PRs updating it at once would race each
    # other's git push. cancel-in-progress stays false: cancelling this
    # over an unrelated PR's build would be wrong, not just wasteful.
    concurrency:
      group: pages-content-push
      cancel-in-progress: false
    env:
      IS_CLOSE: ${{ github.event.action == 'closed' }}
      PR_NUM: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout PR
        if: env.IS_CLOSE != 'true'
        uses: actions/checkout@v5

      - name: Setup Node
        if: env.IS_CLOSE != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: env.IS_CLOSE != 'true'
        run: npm ci

      - name: Build preview
        if: env.IS_CLOSE != 'true'
        run: npm run build
        env:
          DEPLOY_BASE_PATH: /routines/pr-${{ env.PR_NUM }}/

      # See deploy.yml for why this branch exists: it's this workflow's own
      # storage for assembling the whole Pages tree (main's root + every
      # active preview subdirectory), not the Pages source itself.
      - name: Checkout pages-content workspace
        uses: actions/checkout@v5
        with:
          path: pages-content
          fetch-depth: 0

      - name: Switch to pages-content branch (create if missing)
        working-directory: pages-content
        run: |
          git fetch origin pages-content:refs/remotes/origin/pages-content || true
          if git show-ref --verify --quiet refs/remotes/origin/pages-content; then
            git checkout pages-content
          else
            git checkout --orphan pages-content
            git rm -rf . > /dev/null
          fi

      - name: Update this PR's preview subdirectory
        run: |
          rm -rf "pages-content/pr-$PR_NUM"
          if [ "$IS_CLOSE" != "true" ]; then
            mkdir -p "pages-content/pr-$PR_NUM"
            rsync -a dist/ "pages-content/pr-$PR_NUM/"
          fi

      - name: Commit and push pages-content
        working-directory: pages-content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preview for PR #$PR_NUM" --allow-empty
          git push origin HEAD:pages-content

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Remove git metadata before upload
        run: rm -rf pages-content/.git

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-content

      - name: Add preview link to PR description
        if: env.IS_CLOSE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIEW_URL="https://maat-apps.github.io/routines/pr-$PR_NUM/"
          BODY=$(gh pr view "$PR_NUM" --json body -q .body)
          if ! printf '%s' "$BODY" | grep -qF "$PREVIEW_URL"; then
            { printf '%s\n\n**Preview:** %s\n' "$BODY" "$PREVIEW_URL"; } | gh pr edit "$PR_NUM" --body-file -
          fi

  deploy:
    needs: preview
    runs-on: ubuntu-latest
    # A distinct environment from deploy.yml's "github-pages" — that one's
    # auto-configured by GitHub Pages setup with a branch protection rule
    # restricting deploys to main, which a pull_request run's merge ref
    # (refs/pull/<n>/merge) never satisfies. actions/deploy-pages doesn't
    # care what the environment is named, so a fresh one with no such rule
    # sidesteps it rather than needing a manual repo-settings change.
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
