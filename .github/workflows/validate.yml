name: Validate

on:
  pull_request:
    paths:
      # Code linted/typechecked by ESLint + tsc
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      # Other files Prettier formats (prettier --check .)
      - "**/*.json"
      - "**/*.css"
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
      # Tooling / dependency config that changes the outcome
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".prettierrc"
      - ".prettierignore"
      - "eslint.config.mjs"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test coverage
        run: npm run test:coverage
