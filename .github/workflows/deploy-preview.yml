name: Deploy PR preview

# Publishes each open PR under its own "/routines/pr-<n>/" subpath on the
# same GitHub Pages site main deploys to (see deploy.yml), so a change can be
# checked on a phone before merging instead of only after. Closing/merging
# the PR removes its subdirectory again. Shares deploy.yml's "pages-content"
# storage branch and its "pages" concurrency group so a main deploy and a
# preview deploy never race each other's push to that branch.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      # Same "reaches dist/" set deploy.yml watches.
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PR_NUM: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout PR
        if: github.event.action != 'closed'
        uses: actions/checkout@v5

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Build preview
        if: github.event.action != 'closed'
        run: npm run build
        env:
          DEPLOY_BASE_PATH: /routines/pr-${{ github.event.pull_request.number }}/

      # See deploy.yml for why this branch exists: it's this workflow's own
      # storage for assembling the whole Pages tree (main's root + every
      # active preview subdirectory), not the Pages source itself.
      - name: Checkout pages-content workspace
        uses: actions/checkout@v5
        with:
          path: pages-content
          fetch-depth: 0

      - name: Switch to pages-content branch (create if missing)
        working-directory: pages-content
        run: |
          git fetch origin pages-content:refs/remotes/origin/pages-content || true
          if git show-ref --verify --quiet refs/remotes/origin/pages-content; then
            git checkout pages-content
          else
            git checkout --orphan pages-content
            git rm -rf . > /dev/null
          fi

      - name: Update this PR's preview subdirectory
        run: |
          rm -rf "pages-content/pr-$PR_NUM"
          if [ "${{ github.event.action }}" != "closed" ]; then
            mkdir -p "pages-content/pr-$PR_NUM"
            rsync -a dist/ "pages-content/pr-$PR_NUM/"
          fi

      - name: Commit and push pages-content
        working-directory: pages-content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preview for PR #$PR_NUM (${{ github.event.action }})" --allow-empty
          git push origin HEAD:pages-content

      - name: Configure Pages
        if: github.event.action != 'closed'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Remove git metadata before upload
        run: rm -rf pages-content/.git

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-content

      - name: Add preview link to PR description
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIEW_URL="https://maat-apps.github.io/routines/pr-$PR_NUM/"
          BODY=$(gh pr view "$PR_NUM" --json body -q .body)
          if ! printf '%s' "$BODY" | grep -qF "$PREVIEW_URL"; then
            { printf '%s\n\n**Preview:** %s\n' "$BODY" "$PREVIEW_URL"; } | gh pr edit "$PR_NUM" --body-file -
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
